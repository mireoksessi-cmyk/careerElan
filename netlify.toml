# Only addition beyond Netlify's existing zero-config Next.js Runtime
# detection: point it at netlify/functions/ so
# generate-package-background.ts (a hand-written Background Function, not
# a Next.js App Router route) gets deployed. Deliberately does NOT declare
# [[plugins]] package = "@netlify/plugin-nextjs" - Netlify auto-detects and
# auto-installs that plugin on its own even with this file present, and
# pinning it here would stop it from getting automatic version updates.
#
# [functions] directory, not [build] functions - the latter is not a
# recognized key in Netlify's official netlify.toml reference (it was
# silently ignored, meaning this repo's Background Function directory was
# never actually being declared to Netlify's function bundler by this
# file). [functions].directory is the documented key for this purpose.
#
# external_node_modules: production DB/log evidence (see project history)
# proved analyze-resume-background.ts's earlier version failed with
# MODULE_LOAD_FAILED because Netlify's classic Functions bundler
# (zip-it-and-ship-it/esbuild) - a separate pipeline from the Next.js
# Runtime - tried to statically bundle pdf-parse-new/mammoth and broke on
# their internal dynamic requires/native bits. This flags them external so
# the bundler leaves a plain require() in place instead of bundling them,
# letting them resolve from node_modules at runtime. List limited to the
# packages resumeAnalysisCore.ts actually dynamically imports.
[functions]
  directory = "netlify/functions"
  external_node_modules = ["pdf-parse-new", "mammoth"]
