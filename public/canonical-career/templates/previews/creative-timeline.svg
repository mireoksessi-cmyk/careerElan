  <rect x="28" y="300" width="170" height="6" fill="#c9bdd6"/>
  <rect x="28" y="314" width="150" height="6" fill="#c9bdd6"/>
  <rect x="28" y="328" width="180" height="6" fill="#c9bdd6"/>
  <rect x="28" y="342" width="140" height="6" fill="#c9bdd6"/>

