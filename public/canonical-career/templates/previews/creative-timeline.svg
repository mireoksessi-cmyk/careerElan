<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" role="img" aria-label="Creative Timeline template preview">
  <rect x="0" y="0" width="816" height="1056" fill="#ffffff"/>

  <!-- Sidebar column, ~30% width, dark plum -->
  <rect x="0" y="0" width="245" height="1056" fill="#332742"/>

  <!-- Identity masthead in sidebar -->
  <circle cx="52" cy="90" r="30" fill="#d1603d"/>
  <text x="28" y="150" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" fill="#f2ecf7">YOUR NAME</text>
  <rect x="28" y="160" width="160" height="6" fill="#d9cfe0" opacity="0.85"/>
  <text x="28" y="192" font-family="'Segoe UI', Calibri, Arial, sans-serif" font-size="10" letter-spacing="1" opacity="0.8" fill="#f2ecf7">CONTACT</text>
  <rect x="28" y="204" width="140" height="5" fill="#c9bdd6"/>
  <rect x="28" y="218" width="120" height="5" fill="#c9bdd6"/>
  <rect x="28" y="232" width="150" height="5" fill="#c9bdd6"/>
  <rect x="28" y="246" width="110" height="5" fill="#c9bdd6"/>

  <!-- Sidebar: SKILLS -->
