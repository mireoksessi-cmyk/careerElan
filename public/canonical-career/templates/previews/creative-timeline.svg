  <rect x="28" y="394" width="140" height="6" fill="#c9bdd6"/>
  <rect x="28" y="408" width="110" height="6" fill="#c9bdd6"/>

  <!-- Main column: Profile (natural case, not uppercase) -->
  <text x="293" y="90" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#d1603d">Profile</text>
  <rect x="293" y="102" width="475" height="7" fill="#555555"/>
  <rect x="293" y="116" width="475" height="7" fill="#555555"/>
  <rect x="293" y="130" width="320" height="7" fill="#555555"/>

  <!-- Work Experience: vertical timeline line + coral node dots -->
