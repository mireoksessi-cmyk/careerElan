  <line x1="303" y1="186" x2="303" y2="324" stroke="#e2dbe8" stroke-width="3"/>

  <circle cx="303" cy="190" r="7" fill="#d1603d" stroke="#ffffff" stroke-width="2"/>
  <rect x="315" y="186" width="200" height="9" fill="#232323"/>
  <rect x="700" y="186" width="68" height="9" fill="#8a8a8a"/>
  <rect x="315" y="201" width="180" height="7" fill="#d1603d"/>
  <rect x="315" y="216" width="440" height="6" fill="#585858"/>
  <rect x="315" y="230" width="400" height="6" fill="#585858"/>

  <circle cx="303" cy="270" r="7" fill="#d1603d" stroke="#ffffff" stroke-width="2"/>
  <rect x="315" y="266" width="190" height="9" fill="#232323"/>
  <rect x="700" y="266" width="68" height="9" fill="#8a8a8a"/>
  <rect x="315" y="281" width="170" height="7" fill="#d1603d"/>
  <rect x="315" y="296" width="430" height="6" fill="#585858"/>
  <rect x="315" y="310" width="380" height="6" fill="#585858"/>

  <!-- Education: timeline continues -->
  <text x="293" y="360" font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#d1603d">Education</text>
  <line x1="303" y1="376" x2="303" y2="410" stroke="#e2dbe8" stroke-width="3"/>
  <circle cx="303" cy="380" r="7" fill="#d1603d" stroke="#ffffff" stroke-width="2"/>
  <rect x="315" y="376" width="240" height="9" fill="#232323"/>
  <rect x="700" y="376" width="68" height="9" fill="#8a8a8a"/>
  <rect x="315" y="391" width="260" height="7" fill="#585858"/>

  <!-- Projects: plain, no timeline -->
